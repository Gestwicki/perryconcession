<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Perry Pit Stop Calculator</title>
<style>
  :root {
    --bg-main: #0f172a;
    --card-bg: #1e293b;
    --card-active: #334155;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
  
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-main);
  }

  body { display: flex; justify-content: center; }

  .app-container {
    width: 100%;
    max-width: 480px;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-main);
    overflow: hidden;
  }

  /* Header with Secret Mode Switch for Volunteers */
  header {
    background: #000000;
    padding: 6px 12px;
    border-bottom: 2px solid var(--gold);
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-titles { display: flex; flex-direction: column; text-align: left; }
  .header-titles h1 { font-size: 0.95rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
  .mode-indicator { font-size: 0.68rem; font-weight: 800; color: var(--text-muted); }
  .mode-indicator.promo-active { color: #38bdf8; }

  .header-actions { display: flex; align-items: center; gap: 8px; }
  .mode-toggle-btn {
    background: #1e293b;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 0.70rem;
    font-weight: 800;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .mode-toggle-btn.active-promo {
    background: var(--gold);
    color: #000;
  }
  .refresh-btn {
    background: transparent;
    border: none;
    color: var(--gold);
    font-size: 1.2rem;
    cursor: pointer;
  }

  /* Category Navigation */
  .category-tabs {
    display: flex;
    background: #000;
    padding: 6px;
    gap: 6px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 9px 4px;
    background: transparent;
    border: 1px solid #334155;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }

  /* Scrollable Grid Viewport */
  .screen-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .hidden { display: none !important; }

  /* Menu Items Grid */
  .items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .item-card {
    background: var(--card-bg);
    border: 2px solid #334155;
    border-radius: 8px;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 6px;
    cursor: pointer;
  }
  .item-card.has-qty {
    border-color: var(--gold);
    background: var(--card-active);
    justify-content: space-between;
    padding: 6px;
  }
  .item-name {
    font-size: 0.86rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .item-price {
    font-size: 0.80rem;
    color: var(--gold);
    margin-top: 2px;
    font-weight: 600;
  }

  /* Stepper Inside Button */
  .stepper {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    background: #000;
    border-radius: 6px;
    padding: 2px;
    margin-top: 4px;
  }
  .step-btn {
    background: #1e293b;
    border: 1px solid #475569;
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    width: 36px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-btn.del {
    color: var(--red);
    border-color: var(--red);
    font-size: 1rem;
  }
  .qty-count {
    font-size: 1rem;
    font-weight: 800;
    color: var(--gold);
    width: 26px;
    text-align: center;
  }

  /* Pinned Bottom Footer */
  .footer-summary {
    background: #000;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: 2px solid #334155;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .summary-count {
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .summary-total {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--green);
  }

  .action-buttons { display: flex; gap: 8px; }
  .btn {
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-clear { background: var(--red); color: white; width: 32%; }
  .btn-proceed { background: var(--gold); color: #000; width: 68%; text-transform: uppercase; }

  /* Screen 2: Cash & Runner Layout */
  .runner-box {
    background: var(--card-bg);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .runner-title {
    font-size: 0.72rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .runner-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 84px;
    overflow-y: auto;
  }
  .runner-badge {
    background: var(--gold);
    color: #000000;
    font-size: 0.92rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    line-height: 1.1;
  }

  .cash-card {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid #334155;
    flex-shrink: 0;
  }
  .cash-row {
    display: flex;
    justify-content: space-between;
    font-size: 1rem;
    color: var(--text-muted);
  }
  .cash-row strong { color: #fff; }
  .change-row {
    display: flex;
    justify-content: space-between;
    font-size: 1.45rem;
    font-weight: 900;
    color: var(--green);
    border-top: 1px solid #475569;
    padding-top: 4px;
    margin-top: 2px;
  }
  
  .denom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    flex-shrink: 0;
  }
  .denom-btn {
    background: #065f46;
    border: 2px solid var(--green);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 800;
    padding: 8px 4px;
    min-height: 42px;
    border-radius: 6px;
    cursor: pointer;
  }
  .denom-btn:active { background: var(--green); color: #000; }
  .util-btn {
    background: #334155;
    border: 1px solid #64748b;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 4px;
    min-height: 38px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-titles">
      <h1 id="headerTitle">Perry Pit Stop</h1>
      <span class="mode-indicator" id="modeSubtitle">Standard Pricing</span>
    </div>
    <div class="header-actions">
      <!-- SECRET SWITCH FOR VOLUNTEERS TO CHANGE PRICING MODE -->
      <button class="mode-toggle-btn" id="modeToggleBtn" onclick="togglePricingMode()">Promo: Off</button>
      <button class="refresh-btn" onclick="window.location.href=window.location.pathname+'?t='+Date.now()" title="Force Refresh">↻</button>
    </div>
  </header>

  <!-- SCREEN 1: MENU -->
  <div id="screenMenu" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
    <div class="category-tabs">
      <button class="tab-btn active" onclick="switchCategory('hotfood', this)">HOT FOOD</button>
      <button class="tab-btn" onclick="switchCategory('snacks', this)">SNACKS</button>
      <button class="tab-btn" onclick="switchCategory('drinks', this)">DRINKS</button>
    </div>

    <div class="screen-content">
      <div class="items-grid" id="itemsGrid"></div>
    </div>

    <div class="footer-summary">
      <div class="summary-row">
        <span class="summary-count" id="totalItemCount">0 items selected</span>
        <span class="summary-total" id="menuTotalDisplay">$0.00</span>
      </div>
      <div class="action-buttons">
        <button class="btn btn-clear" onclick="clearAllItems()">CLEAR</button>
        <button class="btn btn-proceed" onclick="goToCashScreen()">TOTAL & PAY &rarr;</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: CASH PAYMENT & RUNNER CALLOUT -->
  <div id="screenCash" class="screen-content hidden" style="display:flex; flex-direction:column; gap:8px;">
    <div class="runner-box">
      <span class="runner-title">Runner Order (Call Out)</span>
      <div class="runner-badges" id="runnerBadgesList"></div>
    </div>

    <div class="cash-card">
      <div class="cash-row"><span>Total Due:</span><strong id="payTotalDue">$0.00</strong></div>
      <div class="cash-row"><span>Cash Tendered:</span><strong id="payTendered">$0.00</strong></div>
      <div class="change-row"><span>CHANGE DUE:</span><span id="payChangeDue">$0.00</span></div>
    </div>

    <div class="denom-grid">
      <button class="denom-btn" onclick="addCash(20)">+$20</button>
      <button class="denom-btn" onclick="addCash(10)">+$10</button>
      <button class="denom-btn" onclick="addCash(5)">+$5</button>
      <button class="denom-btn" onclick="addCash(1)">+$1</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
      <button class="util-btn" onclick="exactCash()">EXACT CASH</button>
      <button class="util-btn" onclick="resetCash()">RESET CASH</button>
    </div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:6px; padding-bottom:env(safe-area-inset-bottom, 6px);">
      <button class="btn" style="background:#334155; color:#fff; padding:10px;" onclick="backToOrder()">&larr; BACK TO ORDER</button>
      <button class="btn btn-proceed" style="width:100%; padding:12px;" onclick="newTransaction()">NEW TRANSACTION</button>
    </div>
  </div>
</div>

<script>
// Incremented version to ensure immediate cache reload on volunteer phones
const APP_VERSION = "1.3";

async function checkForUpdates() {
  try {
    const res = await fetch(`index.html?nocache=${Date.now()}`, { cache: "no-store" });
    const text = await res.text();
    const match = text.match(/const APP_VERSION = ["']([^"']+)["']/);
    if (match && match[1] && match[1] !== APP_VERSION) {
      window.location.reload(true);
    }
  } catch (err) {
    // Offline pass
  }
}

checkForUpdates();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdates();
});

// ENHANCED DUAL-PRICING DATA STRUCTURE
// Stores both standard and special pricing internally.
const menuData = [
  // Hot Food
  { id: 1, cat: 'hotfood', name: "Hot Dog", regularPrice: 3.00, promoPrice: 1.00, price: 3.00, qty: 0 },
  { id: 2, cat: 'hotfood', name: "Coney Dog", regularPrice: 6.00, promoPrice: 3.00, price: 6.00, qty: 0 },
  { id: 3, cat: 'hotfood', name: "Walking Taco", regularPrice: 8.00, promoPrice: 8.00, price: 8.00, qty: 0 },
  { id: 4, cat: 'hotfood', name: "Chips & Cheese", regularPrice: 3.00, promoPrice: 3.00, price: 3.00, qty: 0 },
  { id: 5, cat: 'hotfood', name: "Loaded Chips & Cheese", regularPrice: 8.00, promoPrice: 8.00, price: 8.00, qty: 0 },
  { id: 6, cat: 'hotfood', name: "Pretzel Bites & Cheese", regularPrice: 4.00, promoPrice: 4.00, price: 4.00, qty: 0 },
  { id: 7, cat: 'hotfood', name: "Slice of Pizza", regularPrice: 2.50, promoPrice: 2.50, price: 2.50, qty: 0 },
  { id: 8, cat: 'hotfood', name: "Whole Pizza", regularPrice: 18.00, promoPrice: 18.00, price: 18.00, qty: 0 },

  // Snacks & Sweets
  { id: 9, cat: 'snacks', name: "Popcorn", regularPrice: 3.00, promoPrice: 3.00, price: 3.00, qty: 0 },
  { id: 10, cat: 'snacks', name: "Candy (Skittles/Star/Sour/Nerds)", regularPrice: 2.50, promoPrice: 2.50, price: 2.50, qty: 0 },
  { id: 11, cat: 'snacks', name: "Airheads/Suckers/SJ", regularPrice: 0.25, promoPrice: 0.25, price: 0.25, qty: 0 },
  { id: 12, cat: 'snacks', name: "Cookies (2-pack)", regularPrice: 2.00, promoPrice: 2.00, price: 2.00, qty: 0 },
  { id: 13, cat: 'snacks', name: "Bag of Chips", regularPrice: 1.00, promoPrice: 1.00, price: 1.00, qty: 0 },

  // Drinks
  { id: 14, cat: 'drinks', name: "Cold Drink (20oz / Water)", regularPrice: 3.00, promoPrice: 3.00, price: 3.00, qty: 0 },
  { id: 15, cat: 'drinks', name: "Coffee / Hot Chocolate", regularPrice: 2.00, promoPrice: 2.00, price: 2.00, qty: 0 }
];

let isDollarDogNight = false; // Tracks active mode
let activeCategory = 'hotfood';
let cashTendered = 0.00;

// Initializes mode from persistent browser storage on boot
function initMode() {
  const saved = localStorage.getItem('perry_dog_promo');
  if (saved === 'true') {
    isDollarDogNight = true;
  } else {
    isDollarDogNight = false;
  }
  applyPricing();
}

// Swaps mode, saves setting, and re-renders menu
function togglePricingMode() {
  isDollarDogNight = !isDollarDogNight;
  localStorage.setItem('perry_dog_promo', isDollarDogNight ? 'true' : 'false');
  applyPricing();
  renderMenu(); // Re-render to update displayed prices instantly
}

// Applies pricing configuration to the runtime data and header UI
function applyPricing() {
  menuData.forEach(item => {
    item.price = isDollarDogNight ? item.promoPrice : item.regularPrice;
  });

  const toggleBtn = document.getElementById('modeToggleBtn');
  const subtitle = document.getElementById('modeSubtitle');

  if (isDollarDogNight) {
    toggleBtn.textContent = "$1 DOG NIGHT: ON";
    toggleBtn.classList.add('active-promo');
    subtitle.textContent = "Dollar Dog Night Active ($1 Dog / $3 Coney)";
    subtitle.classList.add('promo-active');
  } else {
    toggleBtn.textContent = "$1 DOG: OFF";
    toggleBtn.classList.remove('active-promo');
    subtitle.textContent = "Standard Pricing";
    subtitle.classList.remove('promo-active');
  }
}

function switchCategory(category, tabElement) {
  activeCategory = category;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  tabElement.classList.add('active');
  renderMenu();
}

function renderMenu() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';

  const filtered = menuData.filter(i => i.cat === activeCategory);
  filtered.forEach(item => {
    const card = document.createElement('div');
    if (item.qty === 0) {
      card.className = 'item-card';
      card.onclick = () => updateItemQty(item.id, 1);
      card.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-price">$${item.price.toFixed(2)}</div>
      `;
    } else {
      card.className = 'item-card has-qty';
      const minusContent = item.qty === 1 ? '🗑' : '-';
      const delClass = item.qty === 1 ? 'del' : '';
      card.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-price">$${(item.price * item.qty).toFixed(2)} ($${item.price.toFixed(2)} ea)</div>
        <div class="stepper">
          <button class="step-btn ${delClass}" onclick="event.stopPropagation(); updateItemQty(${item.id}, -1)">${minusContent}</button>
          <span class="qty-count">${item.qty}</span>
          <button class="step-btn" onclick="event.stopPropagation(); updateItemQty(${item.id}, 1)">+</button>
        </div>
      `;
    }
    grid.appendChild(card);
  });

  updateMenuSummary();
}

function updateItemQty(id, delta) {
  const item = menuData.find(i => i.id === id);
  if (item) {
    item.qty = Math.max(0, item.qty + delta);
    renderMenu();
  }
}

function getOrderTotal() {
  return menuData.reduce((sum, item) => sum + (item.price * item.qty), 0);
}

function getTotalItemsCount() {
  return menuData.reduce((sum, item) => sum + item.qty, 0);
}

function updateMenuSummary() {
  const total = getOrderTotal();
  const count = getTotalItemsCount();
  document.getElementById('menuTotalDisplay').textContent = `$${total.toFixed(2)}`;
  document.getElementById('totalItemCount').textContent = `${count} item${count === 1 ? '' : 's'} selected`;
}

function clearAllItems() {
  menuData.forEach(item => item.qty = 0);
  renderMenu();
}

function renderRunnerCallout() {
  const container = document.getElementById('runnerBadgesList');
  container.innerHTML = '';
  const orderedItems = menuData.filter(i => i.qty > 0);
  
  orderedItems.forEach(item => {
    const badge = document.createElement('span');
    badge.className = 'runner-badge';
    badge.textContent = `${item.qty}x ${item.name}`;
    container.appendChild(badge);
  });
}

function goToCashScreen() {
  const total = getOrderTotal();
  if (total === 0) return;
  
  renderRunnerCallout();
  
  document.getElementById('screenMenu').classList.add('hidden');
  document.getElementById('screenCash').classList.remove('hidden');
  document.getElementById('payTotalDue').textContent = `$${total.toFixed(2)}`;
  resetCash();
}

function backToOrder() {
  document.getElementById('screenCash').classList.add('hidden');
  document.getElementById('screenMenu').classList.remove('hidden');
  document.getElementById('headerTitle').textContent = "Perry Pit Stop Menu";
}

function addCash(amount) {
  cashTendered += amount;
  updateCashDisplay();
}

function exactCash() {
  cashTendered = getOrderTotal();
  updateCashDisplay();
}

function resetCash() {
  cashTendered = 0;
  updateCashDisplay();
}

function updateCashDisplay() {
  const total = getOrderTotal();
  const change = Math.max(0, cashTendered - total);
  document.getElementById('payTendered').textContent = `$${cashTendered.toFixed(2)}`;
  document.getElementById('payChangeDue').textContent = `$${change.toFixed(2)}`;
}

function newTransaction() {
  clearAllItems();
  resetCash();
  backToOrder();
}

// Initial application load sequence
initMode();
renderMenu();
</script>
</body>
</html>
